<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel ODS Municípios ES</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#333333; --ink2:#5b6470; --muted:#8a939d; --line:#e4e8ec;
  --bg:#ffffff; --info:#ddeefa; --infob:#83b0d1;
  --navy:#112B54; --primary:#364B60; --slate:#7393A0;
  --l0:#DDE3E8; --l1:#AFC0CC; --l2:#7393A0; --l3:#364B60;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",sans-serif;font-size:13.5px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px}
.info{background:var(--info);border-left:5px solid var(--infob);padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1fr) minmax(0,0.95fr);gap:18px;align-items:start}
h2{font-weight:300;font-size:19px;margin:0 0 6px;color:var(--ink);line-height:1.25}
.sub{font-size:12px;color:var(--muted);margin:-2px 0 6px}
select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #cfd6dc;border-radius:3px;background:#fff;color:var(--ink);width:100%}
select:focus{outline:2px solid var(--infob);outline-offset:0}
label.ctl{display:block;font-size:12px;color:var(--ink2);margin-bottom:8px}
label.ctl span{display:block;margin-bottom:3px}
.mapnow{font-size:12.5px;color:var(--ink2);background:#FDF0DA;border-left:4px solid #F4B351;padding:6px 10px;margin-bottom:8px;min-height:31px}
.comp tr.geral td{border-bottom:1px solid var(--line)}
#map{width:100%;max-height:440px;display:block}
#map path{stroke:#fff;stroke-width:.6;cursor:pointer}
#map path:hover{stroke:var(--navy);stroke-width:1.4}
#map path:focus{outline:none}
#map path:focus-visible,#map path.sel{stroke:#F4B351;stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
.tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);padding:6px 9px;font-size:12.5px;opacity:0;z-index:10}
.tip b{display:block}
.selname{font-size:16px;font-weight:600;color:var(--primary)}
.selmeta{font-size:12px;color:var(--muted);margin-bottom:2px}
#radar{width:100%;max-width:440px;display:block;margin:0 auto}
#radar text{font-family:"Open Sans",sans-serif}
.rleg{display:flex;justify-content:center;gap:16px;font-size:11.5px;color:var(--ink2)}
.rleg i{display:inline-block;width:16px;border-top:2.5px solid var(--primary);vertical-align:middle;margin-right:5px}
.rleg i.es{border-top:2px dashed #8A939D}
.comp{width:100%;border-collapse:collapse;font-size:12.5px}
.comp td{padding:3px 4px;border-bottom:1px solid #f0f2f4;vertical-align:middle}
.comp tr.mech td{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.comp tr.cg{cursor:pointer}
.comp tr.cg:hover td{background:#f6f8fa}
.comp tr.cg.hl td{background:#FDF0DA;font-weight:600}
.comp tr.cg.hl td.code{box-shadow:inset 4px 0 0 #F4B351}
.desc.on{border-left-color:#F4B351}
.reset{font-size:12px;color:#5b6470;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;margin-left:8px;font-family:inherit}
.comp td.code{color:var(--ink2);font-weight:600;width:38px}
.comp td.lv{white-space:nowrap;text-align:right;color:var(--ink2)}
.comp td.lv .sw{margin-right:4px;vertical-align:-1px}
.desc{margin-top:8px;font-size:12.5px;color:var(--ink2);background:#f6f8fa;border-left:3px solid var(--l2);padding:7px 10px;min-height:68px}
.desc b{color:var(--ink)}
.foot{font-size:11.5px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr}.col3{grid-column:1 / -1}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
</style>
<style>.wrap{max-width:none;padding:12px 0}</style></head>
<body>
<div class="wrap">

  <div class="grid">
    <div>
      <h2>Visão do Mapa</h2>
      <div class="mapnow" id="mapnow"></div>
      <svg id="map" role="img" aria-label="Mapa dos municípios do Espírito Santo"></svg>
      <div class="legend" id="legend"></div>
    </div>

    <div>
      <h2>Município</h2>
      <label class="ctl"><select id="munSel" aria-label="Município"><option value="">Espírito Santo (média estadual)</option></select></label>
      <div class="selname" id="selName"></div>
      <div class="selmeta" id="selMeta"></div>
      <svg id="radar" viewBox="0 0 460 380" role="img" aria-label="Radar dos 11 componentes"></svg>
      <div class="rleg" id="rleg"></div>
    </div>

    <div class="col3">
      <h2>Componentes de governança</h2>
      <table class="comp" id="comp"></table>
      <div class="desc" id="desc"></div>
    </div>
  </div>

</div>
<div class="tip" id="tip"></div>

const CG = [
  {s:"Institucionalização", n:"Institucionalização do centro de governo", d:"Verifica se existe instância ou unidade com atribuições formais para conduzir a Agenda 2030 no município (comissão, núcleo ou equipe ODS), com normativo de criação e plano de ação, de modo que a agenda não dependa de iniciativas isoladas nem se perca com mudanças de gestão."},

  {s:"Riscos", n:"Prevenção e tratamento de riscos", d:"Analisa se o município dispõe de mecanismos para identificar, prevenir e tratar riscos transversais às políticas ligadas aos ODS, que ultrapassam a competência de uma única secretaria."},

const $ = id => document.getElementById(id);
const byName = Object.fromEntries(DATA.map(d=>[d.nome,d]));
const N = DATA.length;
const avg = CG.map((_,i)=>DATA.reduce((s,d)=>s+d.v[i],0)/N);
const fmt = x => x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
let colorBy=-1, selected=null;
const val=(d,k)=>k<0?d.g:d.v[k];

function focus(k){colorBy=k;paintMap();radar();table();}
[...DATA].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach(d=>{const o=document.createElement('option');o.value=o.textContent=d.nome;$('munSel').appendChild(o);});
$('munSel').onchange=e=>select(e.target.value||null);

(function(){
  const W=500;let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  const walk=(c,f)=>typeof c[0]==='number'?f(c):c.forEach(x=>walk(x,f));
  GEO.features.forEach(f=>walk(f.geometry.coordinates,([x,y])=>{minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);}));
  const k=Math.cos((miny+maxy)/2*Math.PI/180),pad=4,s=(W-2*pad)/((maxx-minx)*k),H=Math.round((maxy-miny)*s+2*pad);
  const P=([x,y])=>(pad+(x-minx)*k*s).toFixed(1)+','+(pad+(maxy-y)*s).toFixed(1);
  const svg=$('map');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  GEO.features.forEach(f=>{
    const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates,nome=f.properties.nome;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',polys.map(poly=>poly.map(r=>'M'+r.map(P).join('L')+'Z').join('')).join(''));
    p.dataset.nome=nome;p.setAttribute('tabindex','0');p.setAttribute('aria-label',nome);
    p.addEventListener('mousemove',ev=>tip(ev,nome));
    p.addEventListener('mouseleave',()=>$('tip').style.opacity=0);
    p.addEventListener('click',()=>select(selected===nome?null:nome));
    p.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(nome);}});
    svg.appendChild(p);
  });
})();
function paintMap(){
  $('mapnow').innerHTML='Exibindo no mapa: <b>'+(colorBy<0?'Nível geral':'CG'+(colorBy+1)+' · '+CG[colorBy].n)+'</b>';
  document.querySelectorAll('#map path').forEach(p=>p.setAttribute('fill',LEVELS[val(byName[p.dataset.nome],colorBy)].hex));
  const c=[0,0,0,0];DATA.forEach(d=>c[val(d,colorBy)]++);
  $('legend').innerHTML=LEVELS.map((L,i)=>`<span><i class="sw" style="background:${L.hex}"></i>${i} ${L.n} (${c[i]})</span>`).join('');
}
function tip(ev,nome){
  const d=byName[nome],t=$('tip'),v=val(d,colorBy);
  t.innerHTML=`<b>${nome}</b>${colorBy<0?'Nível geral':'CG'+(colorBy+1)}: ${v} · ${LEVELS[v].n}`;
  t.style.opacity=1;
  t.style.left=Math.min(ev.clientX+12,innerWidth-t.offsetWidth-6)+'px';
  t.style.top=Math.min(ev.clientY+12,innerHeight-t.offsetHeight-6)+'px';
}
function radar(){
  const cx=230,cy=186,r=140,n=11,ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*r*v/3,cy+Math.sin(ang(i))*r*v/3];
  const poly=a=>a.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let h='';
  for(let lv=1;lv<=3;lv++)h+=`<polygon points="${poly(Array(n).fill(lv))}" fill="none" stroke="#e4e8ec"/>`;
  for(let i=0;i<n;i++){const[x,y]=pt(i,3),hl=i===colorBy;h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${hl?'#F4B351':'#e4e8ec'}" stroke-width="${hl?2.5:1}"/>`;}
  for(let lv=1;lv<=3;lv++)h+=`<text x="${cx+3}" y="${cy-r*lv/3-2}" font-size="9" fill="#8a939d">${lv}</text>`;
  CG.forEach((c,i)=>{const a=ang(i),x=cx+Math.cos(a)*(r+16),y=cy+Math.sin(a)*(r+16),co=Math.cos(a);
    const an=Math.abs(co)<.2?'middle':co>0?'start':'end',hl=i===colorBy;
    if(hl){const w=i>=9?34:28,bx=an==='middle'?x-w/2:an==='start'?x-4:x-w+4;h+=`<rect x="${bx}" y="${y-9}" width="${w}" height="18" rx="9" fill="#F4B351"/>`;}
    h+=`<text x="${x}" y="${y}" text-anchor="${an}" dominant-baseline="middle" font-size="11" fill="${hl?'#333':'#5b6470'}" font-weight="${hl?700:600}">CG${i+1}<title>${c.n}</title></text>`;});
  h+=`<polygon points="${poly(avg)}" fill="none" stroke="#8A939D" stroke-width="1.8" stroke-dasharray="4 3"/>`;
  if(selected){const d=byName[selected];
    h+=`<polygon points="${poly(d.v)}" fill="rgba(54,75,96,.22)" stroke="#364B60" stroke-width="2.2" stroke-linejoin="round"/>`;
    d.v.forEach((v,i)=>{const[x,y]=pt(i,v);h+=`<circle cx="${x}" cy="${y}" r="${i===colorBy?6.5:4}" fill="#364B60" stroke="${i===colorBy?'#F4B351':'#fff'}" stroke-width="${i===colorBy?3:1.5}"><title>CG${i+1} · ${CG[i].n}: ${v} (${LEVELS[v].n})</title></circle>`;});
  }else avg.forEach((v,i)=>{const[x,y]=pt(i,v);h+=`<circle cx="${x}" cy="${y}" r="${i===colorBy?6:3.5}" fill="#8A939D" stroke="${i===colorBy?'#F4B351':'#fff'}" stroke-width="${i===colorBy?3:0}"><title>CG${i+1} · ${CG[i].n}: média ${fmt(v)}</title></circle>`;});
  $('radar').innerHTML=h;
}
function table(){
  const d=selected?byName[selected]:null;
  $('comp').innerHTML=`<tr class="mech"><td></td><td>Componente</td><td class="lv">Nível (0 a 3)</td></tr>`+(()=>{const gv=d?`<i class="sw" style="background:${LEVELS[d.g].hex}"></i>${d.g}`:fmt(DATA.reduce((s,x)=>s+x.g,0)/N);return `<tr class="cg geral${colorBy<0?' hl':''}" data-i="-1" tabindex="0" title="${d?LEVELS[d.g].n:''}"><td class="code">Geral</td><td>Nível geral de maturidade</td><td class="lv">${gv}</td></tr>`;})()+CG.map((c,i)=>{
    const right=d?`<i class="sw" style="background:${LEVELS[d.v[i]].hex}"></i>${d.v[i]}`:fmt(avg[i]);
    return `<tr class="cg${i===colorBy?' hl':''}" data-i="${i}" tabindex="0" title="${d?LEVELS[d.v[i]].n:''}"><td class="code">CG${i+1}</td><td>${c.n}</td><td class="lv">${right}</td></tr>`;}).join('');
  document.querySelectorAll('#comp tr.cg').forEach(tr=>{const go=()=>{const i=+tr.dataset.i;focus(colorBy===i?-1:i);};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go();};});
  const k=colorBy;$('desc').classList.toggle('on',k>=0);
  if(k<0){$('desc').innerHTML='<b>Nível geral de maturidade.</b> Síntese dos 11 componentes para cada município. Clique em um componente na tabela para ver no mapa e destacá-lo no radar.';return;}
  const c=[0,0,0,0];DATA.forEach(x=>c[x.v[k]]++);
  const mech=MECH.find(m=>m[1].includes(k))[0];
  $('desc').innerHTML=`<span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Mecanismo ${mech}</span><br><b>CG${k+1} · ${CG[k].n}.</b> ${CG[k].d} <span style="color:var(--muted)">No ES: ${c[0]} não implementado, ${c[1]} em implementação, ${c[2]} em desenvolvimento, ${c[3]} otimizado.</span>`;
}
function select(nome){
  selected=nome;$('munSel').value=nome||'';
  document.querySelectorAll('#map path').forEach(p=>{const on=p.dataset.nome===nome;p.classList.toggle('sel',on);if(on)p.parentNode.appendChild(p);});
  if(nome){const d=byName[nome];$('selName').textContent=nome;$('selMeta').innerHTML=`Nível geral: ${d.g} · ${LEVELS[d.g].n}<button class="reset" onclick="select(null)">ver média do ES</button>`;
    $('rleg').innerHTML=`<span><i></i>${nome}</span><span><i class="es"></i>Média do ES</span>`;}
  else{$('selName').textContent='Espírito Santo';$('selMeta').textContent='Média dos 78 municípios · clique no mapa para selecionar';
    $('rleg').innerHTML=`<span><i class="es"></i>Média do ES</span>`;}
  radar();table();
}
paintMap();select(null);
</script>
